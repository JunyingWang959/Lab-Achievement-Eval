.wf-package>div:first-child>.muted{font-size:13px;white-space:nowrap}
.wf-package select{max-width:420px;width:100%;min-width:0;padding:9px 34px 9px 12px;border:1px solid #ccd7e6;border-radius:6px;background:#f8fafc;color:var(--ink);font:600 14px/1.5 'Segoe UI','Microsoft YaHei',Arial,sans-serif;text-overflow:ellipsis}
.wf-package>.btn-row{align-items:center;justify-content:flex-end;gap:8px}
.wf-package button,.wf-package .upload-button{font-size:12px;padding:7px 10px;min-height:35px}
.wf-package .pill{font-size:11px}
.wf-notice{border:1px solid #cfdfef;border-left:3px solid #557bbd;border-radius:6px;background:#edf4fc;color:#335e8e;font-size:14px;line-height:1.6;padding:12px 16px;margin:0 0 18px;overflow-wrap:anywhere}
.workflow-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 24px}
.workflow-steps>a{display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:17px 19px;color:var(--muted);position:relative;min-width:0;transition:background .15s,border-color .15s}
.workflow-steps>a>b{flex-shrink:0;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#eef2f7;color:#71839f;font-size:15px;font-weight:600}
.workflow-steps>a>div{min-width:0;flex:1}
.workflow-steps strong{display:block;color:#526781;font-size:15px;font-weight:600;line-height:1.4}
.workflow-steps span{display:block;font-size:12px;margin-top:4px;color:#7d8da2;line-height:1.4}
.workflow-steps>a>.ico{width:21px;height:21px;color:#91a3bb}
.workflow-steps>a.active{border-color:#92addb;background:#edf3ff;box-shadow:inset 0 -3px #5378ca}
.workflow-steps>a.active>b{background:#466dca;color:#fff}
.workflow-steps>a.active strong,.workflow-steps>a.active>.ico{color:#345cae}
.workflow-steps>a:hover{border-color:#9db3d2;background:#f5f8fd}
.wf-samples{display:flex;align-items:center;justify-content:space-between;gap:18px;background:#f0f4fa;border:1px dashed #bccce1;border-radius:8px;padding:15px 18px;margin:0 0 22px}
.wf-samples>div:first-child{display:flex;flex-direction:column;gap:3px;min-width:0}
.wf-samples strong{font-size:14px;font-weight:600;color:#455c7d}
.wf-samples span{font-size:12px;color:var(--muted)}
.wf-samples>.btn-row{align-items:center;gap:9px;flex-shrink:0}
.wf-samples a{font-size:13px;white-space:nowrap}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.wf-field{display:flex;flex-direction:column;gap:7px;min-width:0;text-align:left;font-size:14px;color:var(--ink)}
.wf-field.full{grid-column:1/-1}
.wf-field>span{font-size:13px;font-weight:600;line-height:1.6;color:#4c5e76}
.wf-field input,.wf-field textarea,.wf-field select,.facts-table input,.facts-table textarea,.cost-entry-table input{display:block;box-sizing:border-box;width:100%;min-width:0;max-width:100%;font:400 14px/1.65 'Segoe UI','Microsoft YaHei',Arial,sans-serif;color:var(--ink);border:1px solid #cad5e3;border-radius:6px;background:#fff;padding:10px 12px;transition:border-color .15s,box-shadow .15s}
.wf-field textarea,.facts-table textarea{resize:vertical;min-height:82px;overflow-wrap:anywhere}
.wf-field textarea{line-height:1.8}
.wf-field input::placeholder,.wf-field textarea::placeholder,.facts-table input::placeholder,.facts-table textarea::placeholder,.cost-entry-table input::placeholder{color:#98a4b5;opacity:1;font-size:13px}
.wf-field input:hover,.wf-field textarea:hover,.wf-field select:hover,.facts-table input:hover,.facts-table textarea:hover,.cost-entry-table input:hover{border-color:#9cb1cc}
.wf-field input:focus,.wf-field textarea:focus,.wf-field select:focus,.facts-table input:focus,.facts-table textarea:focus,.cost-entry-table input:focus,.wf-package select:focus{outline:2px solid #bed1f5;outline-offset:1px;border-color:#5d83c9;box-shadow:0 0 0 3px #345cce0a}
.wf-field input:disabled,.wf-field textarea:disabled,.wf-field select:disabled{background:#f0f3f7;color:#8490a0;cursor:not-allowed}
.material-box{margin-bottom:22px;min-width:0}
.material-box>.panel-head{align-items:flex-start;margin-bottom:9px}
.material-box .panel-head h3{font-size:15px}
.material-box .panel-head p{margin:4px 0 0;font-size:12px}
.upload-button{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:39px;padding:8px 12px;border:1px solid #bfcde0;border-radius:6px;background:#fff;color:#45658e;font-size:13px;font-weight:500;line-height:1.6;white-space:nowrap;cursor:pointer;flex-shrink:0;transition:border-color .15s,background .15s}
.upload-button:hover{border-color:#85a4d2;background:#f2f6fd}
.upload-button:focus-within{outline:3px solid #6896fc;outline-offset:3px}
.upload-button .ico{width:17px;height:17px}
.upload-button input[type=file]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.upload-help{font-size:12px;line-height:1.65;color:#7e8ba0;margin:9px 0 12px}
.empty-inline{border:1px dashed #cbd6e4;border-radius:7px;background:#f7f9fc;padding:19px 17px;color:#77879d;text-align:center;font-size:13px;line-height:1.8;overflow-wrap:anywhere}
.material-entry{background:#fafcff;border-color:#e0e7ef;margin:9px 0}
.material-entry>summary{display:flex;align-items:center;gap:9px;font-weight:400;padding:12px 14px;list-style:none}
.material-entry>summary::-webkit-details-marker{display:none}
.material-entry>summary:after{content:'+';color:#8194b1;font-size:19px;margin-left:1px;font-weight:400;flex-shrink:0}
.material-entry[open]>summary:after{content:'−'}
.material-entry>summary>.ico{margin:0;width:17px;height:17px}
.material-entry>summary>strong{font-size:13px;font-weight:500;flex:1;min-width:0;overflow-wrap:anywhere}
.material-entry>summary>.pill{font-size:11px;flex-shrink:0}
.material-entry>.detail-body{padding:2px 15px 17px}
.material-text{max-height:340px;overflow:auto;max-width:100%;padding:14px 16px;background:#f0f4f9;border:1px solid #dde5ef;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.85 Consolas,'Microsoft YaHei',monospace;color:#52657e;margin:10px 0 14px;tab-size:2}
.role-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.role-card{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:19px 18px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;min-width:0;transition:border-color .15s,box-shadow .15s}
.role-card:hover{border-color:#9aafd0;box-shadow:0 4px 15px #24446b0b}
.role-card>.icon-tile{width:37px;height:37px;border-radius:8px;margin-bottom:12px}
.role-card>.icon-tile .ico{width:21px;height:21px}
.role-card h3{font-size:15px;font-weight:600;margin:0 0 6px}
.role-card p{color:var(--muted);font-size:12px;line-height:1.8;margin:0 0 15px;overflow-wrap:anywhere}
.role-card>div{border-top:1px solid #e7edf4;width:100%;padding-top:11px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:space-between;margin-top:auto}
.role-card>div>span:first-child{font-size:11px;color:#8190a5;line-height:1.8}
.role-card .pill{font-size:11px}
.wf-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:22px 0 3px;margin-top:14px;border-top:1px solid #dde5ef;flex-wrap:wrap}
.wf-actions>button,.wf-actions>.button{min-height:43px;padding:10px 20px;font-size:14px;line-height:1.55}
.intake-kind{display:inline-flex;align-items:center;gap:3px;background:#e8edf5;border:1px solid #dae3ef;padding:4px;border-radius:8px;margin:0 0 16px}
.intake-kind button{border:0;background:transparent;color:#75839b;font-size:13px;padding:8px 17px;box-shadow:none}
.intake-kind button.selected{color:#335da6;background:white;box-shadow:0 2px 6px #27496e12;font-weight:600}
.role-tabs{display:flex;align-items:center;gap:7px;margin:4px 0 17px;flex-wrap:wrap}
.role-tabs>a{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 15px;background:#fff;border:1px solid #dce4ef;border-radius:7px;color:#6b7e99;font-size:13px;min-height:42px;white-space:nowrap}
.role-tabs>a .ico{width:18px;height:18px}
.role-tabs>a.active{border-color:#99afd4;background:#eef4ff;color:#3f61a6;font-weight:600;box-shadow:inset 0 -2px #6a89be}
.role-tabs>a:hover{border-color:#96add0}
.ownership-banner{display:flex;align-items:center;gap:15px;background:#eaf0f9;border:1px solid #dbe5f2;border-radius:9px;padding:19px 21px;margin-bottom:22px}
.ownership-banner>.icon-tile{background:white;flex-shrink:0}
.ownership-banner>div{min-width:0;flex:1}
.ownership-banner h2{font-size:18px;margin:0 0 4px;color:#385679}
.ownership-banner p{font-size:13px;color:#6a7e97;margin:0;line-height:1.7}
.ownership-banner>a{font-size:13px;white-space:nowrap;margin-left:auto}
.template-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.template-toolbar>.btn-row{align-items:center;gap:8px}
.template-toolbar button{font-size:13px;padding:8px 12px}
.template-toolbar~.caption{margin:0 0 16px}
.rule-intake-table{min-width:720px}
.rule-intake-table th:nth-child(1){width:25%}
.rule-intake-table th:nth-child(2){width:17%}
.rule-intake-table th:nth-child(3){width:9%}
.rule-intake-table th:nth-child(4){width:26%}
.rule-intake-table td{font-size:13px;padding:16px 12px}
.rule-intake-table td:last-child{min-width:150px}
.rule-intake-table td:last-child .btn-row{gap:5px}
.rule-intake-table button{padding:6px 8px;white-space:nowrap;font-size:12px}
.rule-intake-table td strong,.rule-intake-table td .subtext{overflow-wrap:anywhere}
.rule-editor{margin-top:22px;padding:23px;background:#f7faff;border:1px solid #cbd9ec;border-left:3px solid #678bcb;border-radius:8px;scroll-margin-top:20px;min-width:0}
.rule-editor>.panel-head{margin:0 0 15px;align-items:flex-start}
.rule-editor>.panel-head h3{font-size:16px;overflow-wrap:anywhere}
.form-section-title{font-size:13px;font-weight:600;color:#476689;padding:17px 0 11px;border-top:1px solid #dce5f1;margin:20px 0 0;display:flex;align-items:center;gap:8px}
.form-section-title:before{content:'';display:inline-block;width:4px;height:13px;border-radius:2px;background:#809ac1}
.rule-editor>.panel-head+.form-section-title{border:0;padding-top:0;margin-top:0}
.rule-editor .form-grid{gap:16px 18px}
.rule-editor .wf-field>span{font-size:12px}
.rule-editor .wf-field input,.rule-editor .wf-field select,.rule-editor .wf-field textarea{font-size:13px}
.rule-validation{font-size:12px;line-height:1.85;padding:12px 14px;background:#edf2fa;color:#657a99;border:1px solid #dbe5f3;border-radius:6px;margin:22px 0 15px;overflow-wrap:anywhere}
.rule-editor>.btn-row{align-items:center;gap:8px}
.rule-editor>.btn-row>button{font-size:13px;padding:9px 14px}
.rule-editor>.caption{margin-bottom:0}
.import-preview{background:#edf5ff;border:1px solid #bfd3eb;border-radius:8px;padding:19px;margin:18px 0}
.import-preview>h3{font-size:15px;color:#3d608f;overflow-wrap:anywhere;margin-bottom:9px}
.import-preview>p{font-size:13px;color:#64809d;line-height:1.8}
.import-preview>div:not(.btn-row){padding:10px 13px;margin:9px 0;background:#ffffffa8;border:1px solid #dce7f5;border-radius:5px}
.import-preview>div:not(.btn-row)>strong{font-size:13px;color:#587190}
.import-preview>div:not(.btn-row)>p{font-size:12px;color:#7286a0;margin:3px 0 0;overflow-wrap:anywhere}
.import-preview>.btn-row{margin-top:14px}
.import-preview button{font-size:13px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:185px;padding:30px 20px;border:1px dashed #cbd7e6;border-radius:8px;background:#f9fbfe;color:#74859b}
.empty-state>.icon-tile{width:45px;height:45px;margin-bottom:14px;background:#edf2f9;color:#7991b3}
.empty-state h3{font-size:16px;color:#5b718e;margin:0 0 7px;font-weight:500}
.empty-state p{font-size:13px;color:#8090a5;line-height:1.8;margin:0;max-width:470px}
.cost-entry-table{margin:16px 0;max-width:100%;min-width:0;overflow:auto;overscroll-behavior-x:contain;scrollbar-color:#b9c7db #edf1f7;scrollbar-width:thin;border:1px solid #e0e7f0;border-radius:6px}
.cost-entry-table table{width:max-content;min-width:100%}
.cost-entry-table th,.cost-entry-table td{padding:11px 9px}
.cost-entry-table th{font-size:12px;padding:12px 10px}
.cost-entry-table td{background:#fff}
.cost-entry-table input{min-width:135px;width:155px;padding:8px 9px;font-size:13px;font-variant-numeric:tabular-nums}
.cost-entry-table td:last-child{position:sticky;right:0;background:#f8fafc;border-left:1px solid #e1e7f0;box-shadow:-3px 0 6px #203a6005}
.cost-entry-table th:last-child{position:sticky;right:0;background:#f0f4fa;border-left:1px solid #e1e7f0;z-index:1}
.cost-entry-table button{font-size:12px;white-space:nowrap;padding:7px 10px}
.cost-tally{font-size:13px;line-height:1.8;background:#f1f6fc;color:#657b98;border-left:3px solid #a3bade;border-radius:4px;padding:12px 15px;margin-top:15px;overflow-wrap:anywhere}
.cost-tally>strong{font-size:17px;color:#3e608c;font-weight:600;margin:0 3px;font-variant-numeric:tabular-nums}
.responsibility-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin:0 0 21px}
.responsibility-flow>div{position:relative;display:grid;grid-template-columns:32px 1fr;gap:1px 10px;align-items:center;padding:16px 19px;background:#eaf0f8;border:1px solid #dce5ef;border-radius:8px;min-width:0}
.responsibility-flow>div:not(:last-child):after{content:'→';position:absolute;right:-21px;top:50%;transform:translateY(-50%);font-size:18px;color:#91a5c1;line-height:1}
.responsibility-flow .ico{grid-row:1/3;color:#7791b7;width:25px;height:25px}
.responsibility-flow strong{font-size:14px;font-weight:600;color:#4e698c}
.responsibility-flow span{font-size:11px;line-height:1.6;color:#7c8faa}
.facts-table{min-width:880px;table-layout:fixed}
.facts-table th:nth-child(1){width:21%}
.facts-table th:nth-child(2){width:22%}
.facts-table th:nth-child(3){width:31%}
.facts-table th:nth-child(4){width:26%}
.facts-table td{font-size:13px;padding:15px 10px;overflow-wrap:anywhere}
.facts-table td:first-child{padding-top:20px;color:#4b617e;font-weight:500}
.facts-table input{font-size:13px;min-height:41px;padding:8px 10px}
.facts-table textarea{font-size:13px;min-height:80px;padding:8px 10px}
.readiness{padding:17px 20px;background:#f1f5fa;border:1px solid #dce5ef;border-left:3px solid #91a6c4;border-radius:7px;margin-top:20px;font-size:13px;line-height:1.75;color:#718198}
.readiness>strong{display:block;color:#506883;font-size:14px;font-weight:600;margin-bottom:6px}
.readiness.pending{background:#fff8ef;border-color:#eedfc7;border-left-color:#c7954b;color:#8e764d}
.readiness.pending>strong{color:#977132}
.readiness.ready{background:#edf7f3;border-color:#cfe5da;border-left-color:#5d9f8b;color:#668b7c}
.readiness.ready>strong{color:#387e67}
.readiness ul{margin:6px 0 0;padding-left:20px;overflow-wrap:anywhere}
.readiness li{margin:3px 0}
.readiness p{font-size:13px;margin:0}
.readiness a{display:inline-block;margin-top:8px;font-size:13px}
.agent-stage-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:20px 0}
.agent-stage-grid>div{position:relative;background:#f6f8fb;border:1px solid #e0e6ef;border-radius:7px;padding:19px 16px;min-width:0}
.agent-stage-grid>div>span{display:grid;place-items:center;width:29px;height:29px;border:1px solid #d7e0ed;border-radius:50%;background:#fff;color:#8b9bb2;font-size:12px;margin-bottom:12px}
.agent-stage-grid strong{font-size:14px;color:#687d9a;font-weight:600;display:block}
.agent-stage-grid p{font-size:12px;color:#8a98ac;line-height:1.7;margin:5px 0 0}
.agent-stage-grid>div.done{background:#edf7f3;border-color:#c4e0d4}
.agent-stage-grid>div.done>span{background:#397f6a;color:white;border-color:#397f6a}
.agent-stage-grid>div.done strong{color:#347864}
.agent-stage-grid>div.done p{color:#6d9385}
.workflow-steps~.panel>.panel-head,.role-tabs~.panel>.panel-head{flex-wrap:wrap;align-items:flex-start}
.workflow-steps~.panel>.panel-head .btn-row{align-items:center}
.workflow-steps~.panel>.panel-head p{margin:5px 0 0}
.workflow-steps~.panel>.panel-head>button:disabled{opacity:.55;cursor:not-allowed;background:#edf0f5;border-color:#dbe3ee;color:#6f819a}
.workflow-steps~.panel>.table-wrap,.role-tabs~.panel>.table-wrap{max-width:100%;min-width:0;overscroll-behavior-x:contain;scrollbar-color:#b9c7db #edf1f7;scrollbar-width:thin}
.report-empty{background:white;margin:23px 0;min-height:245px}
.wf-report-summary{display:grid;grid-template-columns:1.1fr 1fr 1.3fr;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:0 0 12px}
.wf-report-summary>div{padding:23px 26px;min-width:0;border-right:1px solid #e2e8f1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px}
.wf-report-summary>div:first-child{background:var(--navy);border-right:0;color:#fff}
.wf-report-summary>div:last-child{border:0}
.wf-report-summary>div>span{font-size:13px;color:#7b8ca4;line-height:1.7}
.wf-report-summary>div:first-child>span{color:#b9cce5}
.wf-report-summary strong{font-size:39px;letter-spacing:-1px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.wf-report-summary strong>small{font-size:17px;letter-spacing:0;font-weight:400;color:#8b9ab0}
.wf-report-summary>div:first-child strong>small{color:#9fb6d5}
.wf-report-summary strong.result-label{font-size:21px;letter-spacing:0;color:#4c678a;line-height:1.5}
.wf-report-summary>div>small{font-size:12px;color:#8998ab}
.wf-report-summary+.caption{line-height:1.85;margin:10px 0 19px}
.report-rows{margin:18px 0}
.report-row{margin:11px 0;overflow:hidden}
.report-row>summary{display:flex;align-items:center;gap:19px;padding:18px 21px;list-style:none}
.report-row>summary::-webkit-details-marker{display:none}
.report-row>summary:after{content:'+';color:#8c9bb0;font-size:19px;margin-left:3px;font-weight:400}
.report-row[open]>summary:after{content:'−'}
.report-row>summary>div{min-width:0;flex:1}
.report-row>summary>div>span{font-size:11px;color:#8a99ad;font-weight:400;display:block;margin-bottom:4px;overflow-wrap:anywhere}
.report-row>summary>div>strong{font-size:14px;font-weight:600;color:#4d6584;display:block;overflow-wrap:anywhere}
.report-row>summary>strong{font-size:18px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;color:#4f6c92}
.report-row>summary>.pill{font-size:11px}
.report-row>.detail-body{padding:4px 23px 20px}
.report-evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 18px}
.report-evidence-grid>div{background:#f5f8fc;padding:13px 16px;border:1px solid #e6ecf4;border-radius:6px;min-width:0}
.report-evidence-grid>div>span{display:block;color:#8a9bb1;font-size:11px;font-weight:500;margin-bottom:6px}
.report-evidence-grid p{color:#546c89;font-size:13px;line-height:1.85;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.review-note{background:#fff;border:1px solid var(--line);padding:20px 23px;border-radius:8px;margin-top:22px}

/* ASCII hash routes work under both file URLs and GitHub Pages repository paths. */
function routePart(hash=location.hash){
  const p=String(hash||'').replace(/^#?\/?/,'').split('/').filter(Boolean);
  if(!p.length)return ['overview'];
  if(p[0]==='workspace')return p[1]==='intake'?['intake',...p.slice(2)]:['tasks','outcomes'].includes(p[1])?[p[1],...p.slice(2)]:['workbench',...p.slice(1)];
  if(p[0]==='centers')return ['center',...p.slice(1)];
  if(p[0]==='tasks'&&p[1]&&!['input','rules','run'].includes(p[1]))return ['task',...p.slice(1)];
  if(p[0]==='outcomes'&&p[1]&&!['input','rules','run'].includes(p[1]))return ['outcome',...p.slice(1)];
  if(p[0]==='cases')return ['case',...p.slice(1)];
  if(p[0]==='case-study')return ['featured'];
  if(p[0]==='reports')return [p[1]==='tasks'?'task-report':'outcome-report'];
  return p;
}
function routeHref(route){
  const p=routePart(route),[name,...tail]=p;
  let path;
  if(name==='center')path=['centers',...tail];
  else if(name==='task')path=['tasks',...tail];
  else if(name==='outcome')path=['outcomes',...tail];
  else if(name==='case')path=['cases',...tail];
  else if(name==='featured')path=['case-study'];
  else if(name==='workbench')path=['workspace',...tail];
  else if(name==='intake')path=['workspace','intake',...tail];
  else if(['tasks','outcomes'].includes(name))path=tail.length?['workspace',name,...tail]:['overview'];
  else if(name==='task-report')path=['reports','tasks'];
  else if(name==='outcome-report')path=['reports','outcomes'];
  else if(name==='rules')path=['workspace','rules'];
  else if(name==='roi')path=['cases','good','cost'];
  else path=p;
  return '#/'+path.join('/');
}
function presentationHtml(html){return html.replace(/href="#([^"\s]*)"/g,(_,route)=>'href="'+routeHref(route)+'"');}
function normalizeLocation(){if(typeof history!=='undefined'){const href=routeHref(location.hash);if(location.hash!==href)history.replaceState(null,'',href);}}

// Legacy preset snapshots retain their original text in storage. Only their view is relabeled.
function displayLabel(value){return String(value??'').replace(/（(?:模拟|演示|演示内置|模拟占位|演示口径|离线模拟)）/g,'').replace(/演示包/g,'预设方案').replace(/演示规则/g,'预设规则').replace(/模拟[:：]?|演示/g,'').replace(/DEMO\s*0\.1/gi,'R1').replace(/\s*·\s*$/,'');}
function presentationProject(p){
  if(!p?.demoKey)return p;
  const structural=new Set(['id','_id','demoKey','kind','method','scope']);
  function copy(value,key=''){
    if(typeof value==='string')return structural.has(key)?value:displayLabel(value);
    if(Array.isArray(value))return value.map(v=>copy(v));
    if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).map(([k,v])=>[k,copy(v,k)]));
    return value;
  }
  const view=copy(p);if(view.report)view.report.status=displayLabel(view.report.status);return view;
}

function itemScore(i){if(i.actual===null)return null;return i.weight*(i.type==='gate'?(i.actual>=i.target?1:0):Math.min(Math.max(i.actual,0)/i.target,1));}
function taskResult(t){const known=t.items.filter(i=>i.actual!==null);const pass=known.filter(i=>i.actual>=i.target).length;const fail=known.length-pass;const unknown=t.items.length-known.length;const score=known.reduce((s,i)=>s+itemScore(i),0);return{score,upper:score+t.items.filter(i=>i.actual===null).reduce((s,i)=>s+i.weight,0),pass,fail,unknown,status:unknown?'待核验':fail?'差':(t.demoRating||'中')};}

function resourceResult(c,k=DEMO.common){if(![c.hours,c.formal,c.intern,c.api,c.performance].every(x=>Number.isFinite(x)&&x>=0)||c.performance>100||![k.budget,k.base,k.target,k.hourRate,k.formalRate,k.internRate].every(Number.isFinite)||k.base<0||k.target>100||k.hourRate<=0||k.formalRate<=0||k.internRate<=0)return null;const compute=c.hours*k.hourRate;const labor=c.formal*k.formalRate+c.intern*k.internRate;const cost=compute+labor+c.api;if(cost<=0||k.budget<=0||k.target<=k.base)return null;const delta=Math.max(0,c.performance-k.base);const q=Math.max(0,Math.min(1,delta/(k.target-k.base)));const roi=delta/(cost/1e8);const targetRoi=(k.target-k.base)/(k.budget/1e8);const budgetScore=8*q*Math.min(1,k.budget/cost);const roiScore=12*q*Math.min(1,roi/targetRoi);return{compute,labor,cost,delta,q,roi,targetRoi,budgetScore,roiScore,score:budgetScore+roiScore,weightedMonths:c.formal+.2*c.intern};}
function caseResult(c){const resource=resourceResult(c);const complete=Array.isArray(c.levels)&&c.levels.length===4&&c.levels.every(x=>Number.isInteger(x)&&x>=0&&x<=4);const science=complete?c.levels.reduce((s,x)=>s+5*x,0):null;const total=resource&&complete?science+resource.score:null;const excellent=total!==null&&total>=85&&science>=60&&c.levels.every(x=>x>=3)&&c.performance>=DEMO.common.target;return{science,resource,total,excellent,grade:total===null?'待核验':excellent?'优':total<60?'差':'待复核'};}

function centerPage(id,view='overview'){const c=getCenter(id);if(!c)return centersPage();view=['tasks','outcomes'].includes(view)?view:'overview';const r=centerScore(c);return '<a class="back" href="#overview">返回中心评价总览</a>'+heading(c.name+' · '+({overview:'评价报告',tasks:'中心任务',outcomes:'关键成果'}[view]),c.tag,badge('930评价周期','blue'))+centerTabs(c,view)+(view!=='outcomes'?`<div class="decision-band"><div class="decision-score"><span>一级任务评价分</span><div><strong>${scoreText(r)}</strong><small>/ 100</small></div>${statusBadge(r.status)}</div><div class="decision-main"><h2>${c.summary}</h2><p>${gradeGuide()}</p><div class="compact-kpis"><div><strong>${c.tasks.length}</strong><span>一级任务</span></div><div><strong>${r.pass}<small> / ${r.pass+r.fail+r.unknown}</small></strong><span>达标指标</span></div><div><strong>${r.fail}</strong><span>指标缺口</span></div><div><strong>${centerOutcomes(c).length}</strong><span>关键成果</span></div></div></div></div>`+sectionHead('01','一级任务与得分','任务等级按条件锚点判断；加权得分用于汇总，中心等级暂取最低任务档。')+centerTaskCards(c):'')+(view!=='tasks'?sectionHead(view==='overview'?'02':'01','关键成果评价','每项成果独立展示价值与投入效率，不与中心任务分混合平均。')+outcomeCards(c):'')+(view==='overview'?`<div class="center-next"><a href="#center/${c.id}/tasks">展开中心任务报告 →</a><a href="#center/${c.id}/outcomes">展开关键成果报告 →</a></div>`:'')+(c.id==='agent'&&view!=='tasks'?legacyCaseLinks():'')+ruleReference()+footer();}
function legacyCaseLinks(){return sectionHead('案例','催化材料 · 优差对照','同一成果的两种评价案例，保留原有科学与成本完整报告。',`<a class="text-button" href="#comparison">完整优差对照 →</a>`)+`<div class="legacy-case-grid">${DEMO.cases.map(c=>`<a class="panel" href="#case/${c.id}"><span>${badge(c.label+'',c.id==='good'?'green':'red')}</span><strong>${fmt(caseResult(c).total)}<small> / 100</small></strong><h3>${c.title}</h3><p>${c.summary}</p><span>查看科学价值、成本与证据 →</span></a>`).join('')}</div>`;}
function centerOutcomePage(id){const o=CENTER_OUTCOMES.find(o=>o.id===id);if(!o)return centersPage('outcomes');const c=getCenter(o.center),t=getTask(o.task).task,r=outcomeResult(o),v=r.resource;const dims=o.type==='高峰'?['科学问题突破','原创性贡献','国际影响力','技术领先程度']:['Benchmark 表现','性能提升','应用效果','推广价值'];return `<a class="back" href="#center/${c.id}/outcomes">返回${c.name}关键成果</a>`+heading(o.name,`${c.name} · ${o.type}类成果 · 关联任务：${t.name}`,badge('成果评价','blue'))+`<div class="decision-band"><div class="decision-score"><span>成果综合得分</span><div><strong>${fmt(r.total)}</strong><small>/ 100</small></div>${badge(o.type+'类 · 待复核','amber')}</div><div class="decision-main"><h2>${o.verdict}</h2><p>成果价值 ${r.value}/80 + 投入效率 ${fmt(v.score)}/20。下方逐项说明给分原因与投入计算。</p><a class="text-button" href="#task/${o.task}">查看关联一级任务 →</a>${o.feature?' · <a class="text-button" href="#featured">查看 Agent 建设方案 →</a>':''}</div></div>`+sectionHead('01','成果价值与支撑依据',`${o.type}类采用差异化关注维度；每维20分，权重待科管和总师确认。`)+`<div class="value-evidence-grid">${dims.map((d,i)=>`<article class="panel"><div class="panel-head"><h3>${d}</h3><strong>${o.scores[i]} / 20</strong></div>${progress(o.scores[i],20,'blue')}<p>${o.facts[i]}</p><div class="evidence-request"><span>材料定位</span>${o.name} · 支撑材料 §${i+1}</div><p class="caption">得分 ${o.scores[i]}，距满分 ${20-o.scores[i]} 分；按上述证据覆盖与局限设置，正式锚点需责任方提供。</p></article>`).join('')}</div>`+sectionHead('02','投入与产出辅助分析','人力、算力、API统一归集；仅比较当前成果的同口径基线与目标。')+`<div class="grid two"><section class="panel"><h3>研发投入 · ${money(v.cost)} 万元</h3><table><tbody><tr><th>正式人力</th><td>${o.formal}人月 × 5万元</td><td>${fmt(o.formal*5)}万</td></tr><tr><th>实习人力</th><td>${o.intern}人月 × 1万元</td><td>${fmt(o.intern)}万</td></tr><tr><th>算力</th><td>${o.hours}卡时 × 25.2元</td><td>${money(v.compute)}万</td></tr><tr><th>API</th><td>账单</td><td>${money(o.api)}万</td></tr></tbody></table><p class="caption">计价标准；不含部署运营、耗材与设备。人力说明：按本成果归集；资源说明：仅统计研发期消耗，</p></section><section class="panel"><h3>目标增益与资源效率</h3><p>冻结任务成功率：基线 ${o.base}% → 目标 ${o.target}% → 实际 ${o.performance}%。</p><p>预算 ${money(o.budget)} 万元；目标增益达成 ${fmt(v.q*100)}%。增量 ROI ${fmt(v.roi)} 百分点/亿元。</p><div class="rule-formula">预算分 = 8 × ${fmt(v.q,3)} × ${fmt(Math.min(1,o.budget/v.cost),3)} = ${fmt(v.budgetScore,2)}<br>ROI分 = 12 × ${fmt(v.q,3)} × ${fmt(Math.min(1,v.roi/v.targetRoi),3)} = ${fmt(v.roiScore,2)}</div><p class="caption">ROI衡量能力增益效率，不是财务回报。能力指标改善不能直接证明科学突破。</p>${resourceReference()}</section></div>`+footer();}

function trajectory(){const w=680,h=285,x0=60,y0=24,plotW=572,plotH=203;const x=v=>x0+v/160*plotW,y=v=>y0+(85-v)/25*plotH;return `<svg class="chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="累计投入与任务成功率曲线：优例从0万元60%到100万元82%，差例从0万元60%到150万元68%。坐标纵轴范围60%至85%。">${[60,65,70,75,80,85].map(v=>`<line x1="${x0}" y1="${y(v)}" x2="${x0+plotW}" y2="${y(v)}" stroke="#e4eaf2"/><text x="${x0-10}" y="${y(v)+4}" text-anchor="end" font-size="18" fill="#748399">${v}%</text>`).join('')}${[0,40,80,120,160].map(v=>`<text x="${x(v)}" y="${y0+plotH+24}" text-anchor="middle" font-size="18" fill="#748399">${v}</text>`).join('')}<line x1="${x0}" y1="${y(80)}" x2="${x0+plotW}" y2="${y(80)}" stroke="#7c90b0" stroke-dasharray="4 4"/><text x="${x0+plotW}" y="${y(80)-7}" font-size="18" text-anchor="end" fill="#667997">目标80%</text>${DEMO.cases.map((c,i)=>`<polyline points="${c.stages.map(s=>`${x(s.cost)},${y(s.p)}`).join(' ')}" fill="none" stroke="${i?'#bb6d61':'#19857c'}" stroke-width="3"/>${c.stages.map((s,j)=>`<circle cx="${x(s.cost)}" cy="${y(s.p)}" r="4" fill="${i?'#bb6d61':'#19857c'}"><title>${c.label} ${s.label}：累计${s.cost}万元，成功率${s.p}%</title></circle>${j===3?`<text x="${x(s.cost)-6}" y="${y(s.p)-12}" text-anchor="end" fill="${i?'#a04c43':'#147970'}" font-size="18">${c.label} ${s.p}%</text>`:''}`).join('')}`).join('')}<text x="${x0}" y="13" font-size="18" fill="#748399">冻结盲测任务成功率</text><text x="${x0+plotW}" y="${h-7}" text-anchor="end" font-size="18" fill="#748399">累计模型研发投入 / 万元</text></svg>`;}

function dashboard(){const r=centerResult(),completed=DEMO.tasks.filter(t=>!taskResult(t).fail&&!taskResult(t).unknown).length;return heading('评测中心 · 一级任务考核','930 里程碑：完成了多少，哪些承诺仍有缺口。',`<a class="text-button" href="#workbench/rules">${icon('book')}评分规则</a>`)+
`<div class="decision-band"><div class="decision-score"><span>完成程度诊断</span><div><strong>${scoreText(r)}</strong><small>/ 100</small></div>${statusBadge(r.status,'任务等级：'+r.status+'')}</div><div class="decision-main"><div class="decision-title">${icon(r.fail?'alert':'check')}<h2>${r.fail?`${r.fail} 项指标尚未达成，需补齐后验收`:r.unknown?'存在待核验材料':'原定指标全部达成'}</h2></div><p>完成度分数与条件等级分别展示；未完成基本目标为差，缺证据为待核验。</p><div class="compact-kpis"><div><strong>${completed}<small> / 4</small></strong><span>完整达标任务</span></div><div><strong>${r.pass}<small> / 12</small></strong><span>达标原子指标</span></div><div><strong>${r.unknown}</strong><span>待核验指标</span></div></div></div></div>`+

`<div class="mission-grid">${DEMO.tasks.map(t=>{const s=taskResult(t);return `<a class="mission-card" href="#task/${t.id}"><div class="mission-top"><span class="icon-tile">${icon(t.id)}</span>${statusBadge(s.status)}</div><h2>${t.name}</h2><div class="subtext">负责人 ${t.owner} · ${s.pass}/${t.items.length} 项达标</div><div class="mission-score"><strong>${scoreText(s)}<small> / ${t.max}</small></strong><span>诊断得分</span></div>${progress(s.score,t.max,s.fail?'amber':'green')}<div class="mission-items">${t.items.map(i=>`<div><span>${i.name}</span><strong class="${i.actual===null?'muted':i.actual<i.target?'value-bad':''}">${i.type==='gate'?actualValue(i):`${i.actual===null?'?':fmt(i.actual,0)} / ${fmt(i.target,0)}${i.unit}`}</strong></div>`).join('')}</div><div class="mission-end">查看考核明细 ${icon('chevron')}</div></a>`}).join('')}</div>`+

`<nav class="task-tabs" aria-label="一级任务">${center.tasks.map(x=>`<a class="${x.id===id?'active':''}" href="#task/${x.id}">${icon(x.id)}${x.name}</a>`).join('')}</nav>`+
`<div class="task-ribbon"><div><span>诊断得分</span><strong>${scoreText(r)}<small> / ${t.max}</small></strong></div><div><span>指标达标</span><strong>${r.pass}<small> / ${t.items.length}</small></strong></div><div><span>未达标 / 待核验</span><strong>${r.fail}<small> / ${r.unknown}</small></strong></div><p>${r.unknown?'缺少材料，等级待核验。':r.fail?'基本目标仍有缺口，四档评价为差；完成度分数单独保留。':'达到基本目标，评为中；良、优需要更高档条件证据。'}</p></div>`+
sectionHead('01','逐项核对：目标、实际、差距','每项展开后可见计算过程、考核方式和所需证据。')+
`<div class="indicator-list">${t.items.map((i,index)=>{const s=itemScore(i),state=i.actual===null?'待核验':i.actual>=i.target?'达标':'未达标';return `<details class="indicator-card"><summary><div class="indicator-name"><span class="index-disc">${String(index+1).padStart(2,'0')}</span><div><h3>${i.name}</h3><p>${i.goal}</p></div></div><div class="indicator-values"><div><span>目标</span><strong>${goalValue(i)}</strong></div><div><span>实际</span><strong class="${state==='未达标'?'value-bad':''}">${actualValue(i)}</strong></div><div><span>得分</span><strong>${fmt(s)}<small> / ${i.weight}</small></strong></div></div>${statusBadge(state)}<span class="expand-mark">${icon('chevron')}</span></summary><div class="detail-body"><div class="grid two"><div><h3>${icon('chart')}计分依据</h3><p>${i.actual===null?'材料待核验；暂不扣分，分值区间0–'+i.weight:i.note}</p><div class="rule-formula">${s===null?'暂不认定得分':i.type==='ratio'?`${i.weight} × min(${i.actual} ÷ ${i.target}, 1) = ${fmt(s)} 分`:`验收${state==='达标'?'通过':'未通过'} = ${fmt(s)} 分`}</div><p class="caption">${s===null?'不以0分替代缺失材料。':`扣 ${fmt(i.weight-s)} 分${i.actual<i.target?`；距目标差 ${i.target-i.actual} ${i.unit}。`:'；达到本项验收条件。'}`}</p></div><div><h3>${icon('shield')}考核与证据</h3><p>${i.method}</p><div class="evidence-request"><span>需提交材料</span>${i.proof}</div><p class="caption">材料类型为验收要求，不代表当前已经取得这些证据。</p></div></div></div></details>`}).join('')}</div>`+
`<div class="grid two section"><details><summary>${icon('book')}本任务计分与验收规则</summary><div class="detail-body"><p>数量项按实际验收数/目标数计分并封顶；体系、平台与机制按验收条件通过计满分。权重与细则为当前设定。</p><p>${gradeGuide()} 本轮中心汇总暂按最低任务档展示，属于汇总口径，待科管确认。</p></div></details><details><summary>${icon('clock')}1230后续目标（未计入本轮）</summary><div class="detail-body">${t.next}</div></details></div>`+(id==='peak'?sectionHead('依据','新增930条件锚点','用户本轮补充规划；与原版指标结构尚待科管对齐，不把新增指标直接计入旧分数。')+`<section class="panel">${anchorTable()}<a class="text-button" href="#center/evaluation/planning">查看完整中心定位与新版规划 →</a></section>`:'')+footer();}
function scienceCompare(){return `<div class="compare-legend"><span><i class="dot good-dot"></i>优例</span><span><i class="dot poor-dot"></i>差例</span><span>每维满分20</span></div>${DEMO.science.map((d,i)=>`<div class="paired-row"><strong>${d.name}</strong><div class="paired-bars"><div>${progress(DEMO.cases[0].levels[i]*5,20,'green')}<span>${DEMO.cases[0].levels[i]*5}</span></div><div>${progress(DEMO.cases[1].levels[i]*5,20,'red')}<span>${DEMO.cases[1].levels[i]*5}</span></div></div></div>`).join('')}`;}
function outcomes(){return heading('标志性成果评价','同一任务、两种结果：科学证据与资源效率共同决定评分。',`<a class="text-button" href="#workbench/rules">${icon('book')}查看评分规则</a>`)+
`<div class="project-context"><span class="icon-tile">${icon('flask')}</span><div><strong>催化材料科学假设生成与验证智能体</strong><p>冻结盲测基线 <b>60%</b><span>目标 <b>80%</b></span><span>研发预算 <b>120万元</b></span></p></div></div>`+
sectionHead('01','评价结果','科学价值80分 + 资源效率20分，满分100分。')+
`<div class="grid two">${DEMO.cases.map(c=>{const r=caseResult(c);if(r.total===null)return `<article class="panel"><h2>${c.label} · 待核验</h2><p>当前数据未齐全，暂不生成综合分。</p><a href="#case/${c.id}">查看已知分项</a></article>`;return `<article class="outcome-card ${c.id==='poor'?'poor':''}"><div class="outcome-top"><span class="icon-tile">${icon(c.id==='good'?'award':'alert')}</span>${badge(c.label+'',c.id==='good'?'green':'red')}<a href="#case/${c.id}">评价详情 ${icon('chevron')}</a></div><div class="outcome-score"><strong>${fmt(r.total)}</strong><span>/ 100</span><p>${c.id==='good'?'建议总师复核':'建议补证复评'}</p></div><h2>${c.title}</h2>${splitScore(r)}<div class="mini-evidence"><span>${icon(c.id==='good'?'check':'alert')}${c.id==='good'?'对照实验支持新关联':'科学新认识证据不足'}</span><span>${icon(c.id==='good'?'shield':'file')}${c.id==='good'?'独立合作组完成复验':'原始记录与复验材料缺失'}</span></div><div class="case-metrics"><div><span>研发投入</span><strong>${fmt(r.resource.cost/10000,0)}<small> 万元</small></strong></div><div><span>任务成功率</span><strong>${c.performance}<small>%</small></strong></div><div><span>增量能力ROI</span><strong>${fmt(r.resource.roi,0)}</strong><small>百分点/亿元</small></div></div><div class="outcome-actions"><a class="button primary" href="#case/${c.id}">查看评价详情</a><a class="button" href="#case/${c.id}/cost">成本与 ROI</a></div></article>`}).join('')}</div>`+
sectionHead('02','优差的关键原因','科学证据决定成果价值，投入产出反映资源使用效率。')+
`<div class="grid two"><section class="panel"><div class="visual-title">${icon('flask')}<h3>科学价值：70 分 vs 15 分</h3></div>${scienceCompare()}<p class="caption">benchmark涨分不直接计作科学新认识；独立验证和可复现单独评价。</p></section><section class="panel"><div class="visual-title">${icon('chart')}<h3>投入增加后，能力是否持续改善</h3></div>${trajectory()}<div class="compare-legend"><span><i class="dot good-dot"></i>优例</span><span><i class="dot poor-dot"></i>差例</span></div><p class="caption">纵轴60%–85%；两例使用同一冻结任务集。</p><details><summary>查看阶段数据及判断边界</summary><div class="detail-body"><table><thead><tr><th>情景</th><th>起点</th><th>阶段1</th><th>阶段2</th><th>930</th></tr></thead><tbody>${DEMO.cases.map(c=>`<tr><td>${c.label}</td>${c.stages.map(s=>`<td>${s.cost}万<br>${s.p}%</td>`).join('')}</tr>`).join('')}</tbody></table><p>盲测成功表示完成假设提出、证据整理与验证方案生成，不等于已形成科学发现。</p></div></details></section></div>`+
`<div class="closing-note">${icon('shield')}<p>“优”需通过科学证据与任务达成门槛，科学突破等级仍由总师复核。评分不自动触发经费或人员调整。</p></div>`+footer();}
function caseTabs(c,view){return `<div class="case-nav"><nav class="detail-tabs" aria-label="成果详情分区"><a class="${view==='overview'?'active':''}" href="#case/${c.id}">${icon('award')}评价总览</a><a class="${view==='science'?'active':''}" href="#case/${c.id}/science">${icon('flask')}科学价值 <small>80分</small></a><a class="${view==='cost'?'active':''}" href="#case/${c.id}/cost">${icon('wallet')}成本与 ROI <small>20分</small></a></nav><a class="case-switch" href="#case/${c.id==='good'?'poor':'good'}/${view}">切换${c.id==='good'?'差例':'优例'}</a></div>`;}
function casePage(id,view='overview'){const c=DEMO.cases.find(c=>c.id===id);if(!c)return outcomes();const r=caseResult(c);if(r.total===null)return `<a class="back" href="#comparison">返回优差对照</a>`+heading(c.label+' · 材料待核验','综合分与评级暂不生成。')+`<section class="panel"><h2>已核定分项</h2><p>科学价值：${fmt(r.science)} / 80；资源效率：${fmt(r.resource?r.resource.score:null)} / 20。</p></section>`+footer();view=['science','cost'].includes(view)?view:'overview';return `<a class="back" href="#comparison">返回优差对照</a>`+heading(c.label+' · 成果评价详情','催化材料科学假设生成与验证智能体',badge('成果案例 · '+fmt(r.total)+'分',c.id==='good'?'green':'red'))+caseTabs(c,view)+(view==='science'?sciencePage(c,r):view==='cost'?costPage(c,r):caseOverview(c,r))+footer();}
function caseOverview(c,r){const v=r.resource;const ev=c.id==='good'?['可证伪的结构—活性关联','3个独立制备批次与对照','独立合作组按冻结方案复验','目标场景可用，边界已说明']:['主要支持预测排序改善','单批制备与材料样本','原始记录及复验材料未交付','用途仍停留在设想'];return `<div class="decision-band"><div class="decision-score"><span>综合评价得分</span><div><strong>${fmt(r.total)}</strong><small>/ 100</small></div>${badge(r.grade+' · 评价等级',r.excellent?'green':'red')}</div><div class="decision-main"><h2>${c.verdict}</h2><p>${c.summary}</p>${splitScore(r)}</div></div>`+
sectionHead('01','一眼看清评分构成','科学价值与成本效率同时呈现，详细证据分区查看。')+
`<div class="grid two"><a class="panel link-panel" href="#case/${c.id}/science"><div class="panel-head"><div class="visual-title">${icon('flask')}<h2>科学价值</h2></div><strong class="section-score">${r.science}<small> / 80</small></strong></div>${DEMO.science.map((d,i)=>`<div class="science-mini"><span>${d.name}</span>${progress(c.levels[i]*5,20,'blue')}<strong>${c.levels[i]*5}<small> /20</small></strong></div>`).join('')}<div class="mission-end">查看四维评分与证据 ${icon('chevron')}</div></a><a class="panel link-panel" href="#case/${c.id}/cost"><div class="panel-head"><div class="visual-title">${icon('wallet')}<h2>资源效率</h2></div><strong class="section-score">${fmt(v.score,2)}<small> / 20</small></strong></div><div class="resource-mini"><div>${icon('wallet')}<span>研发投入</span><strong>${money(v.cost)}<small> 万元</small></strong><p>预算120万元 · ${fmt(v.cost/1200000*100,1)}%</p></div><div>${icon('chart')}<span>增量能力ROI</span><strong>${fmt(v.roi,1)}</strong><p>百分点/亿元 · 目标1,666.7</p></div></div><div class="science-mini"><span>预算约束</span>${progress(v.budgetScore,8,'green')}<strong>${fmt(v.budgetScore,2)}<small> /8</small></strong></div><div class="science-mini"><span>增量ROI</span>${progress(v.roiScore,12,'green')}<strong>${fmt(v.roiScore,2)}<small> /12</small></strong></div><div class="mission-end">查看成本与计分公式 ${icon('chevron')}</div></a></div>`+
sectionHead('02','科学证据链','按科学假设、对照验证、独立复现与应用边界查看支撑证据。')+
`<div class="evidence-chain">${['科学假设','对照验证','独立复现','应用边界'].map((n,i)=>`<div><span class="chain-step ${c.levels[i]<3?'weak':''}">${icon(['target','flask','shield','layers'][i])}</span><h3>${n}</h3><p>${ev[i]}</p><span class="pill ${c.levels[i]>=3?'green':'amber'}">${c.levels[i]}档 · ${c.levels[i]*5}分</span></div>`).join('')}</div>`+
sectionHead('03','下一步行动','由负责部门复核后再形成正式评价与资源建议。')+`<div class="action-list">${c.actions.map((a,i)=>`<div><span>${i+1}</span><p>${a}</p></div>`).join('')}</div>`;}
function sciencePage(c,r){const labels=['支持新关联，跨体系证据仍需补充','验证条件充分，重复与对照齐备','独立合作团队复验核心结果','目标场景成立，多场景仍需验证'];const badLabels=['预测排序改善不足以认定新认识','单批样例不足以确认科学效果','当前提交包无法复查核心结论','应用用途尚未完成目标场景验证'];return `<div class="subsection-intro"><span class="icon-tile">${icon('flask')}</span><div><h2>科学与成果价值 <strong>${r.science} / 80</strong></h2><p>规则负责人：总师 · 四个维度各20分 · 档位0–4乘以5</p></div></div>`+
`<div class="science-grid">${DEMO.science.map((d,i)=>`<section class="science-card"><div class="panel-head"><span class="icon-tile">${icon(['target','flask','shield','layers'][i])}</span><strong class="section-score">${c.levels[i]*5}<small> / 20</small></strong></div><h2>${d.name}</h2><p>${c.id==='good'?labels[i]:badLabels[i]}</p><div class="level-scale" aria-label="第${c.levels[i]}档，共4档">${[1,2,3,4].map(x=>`<span class="${x<=c.levels[i]?'filled':''}"></span>`).join('')}<b>${c.levels[i]}档</b></div><details><summary>展开证据与给分理由</summary><div class="detail-body"><div class="evidence-block"><span>材料摘要</span><p>${c.evidence[i].fact}</p></div><div class="evidence-block"><span>给分理由</span><p>${c.evidence[i].reason}</p></div><div class="evidence-block"><span>扣分与局限</span><p>${c.evidence[i].gap}</p></div><div class="rule-formula">本档条件：${d.levels[c.levels[i]]}</div></div></details></section>`).join('')}</div>`+
`<div class="closing-note">${icon('shield')}<p>仅有benchmark改善，新认识维最高1档；材料实验类成果只有计算预测时，实证维最高1档；没有独立验证，复现维不能达到3–4档。</p></div><details><summary>${icon('book')}查看完整科学价值rubric及待核验规则</summary><div class="detail-body">${scienceRubric()}<p>0档是已核查的提交包不足以支持给分；尚未收到或核查的材料应标“待核验”，不直接记0分。</p></div></details>`;}
function donutCost(c,v){const rows=[{name:'研发算力',val:v.compute,color:'#4568ce'},{name:'正式员工',val:c.formal*50000,color:'#269286'},{name:'实习生',val:c.intern*10000,color:'#86c0b5'},{name:'研发API',val:c.api,color:'#a4b3d1'}];let offset=0;return `<div class="cost-visual"><svg viewBox="0 0 180 180" role="img" aria-label="研发成本构成：${rows.map(a=>a.name+fmt(a.val/v.cost*100,1)+'%').join('，')}"><circle cx="90" cy="90" r="64" fill="none" stroke="#eef1f6" stroke-width="20"/>${rows.map(a=>{const len=a.val/v.cost*402.124,old=offset;offset+=len;return `<circle cx="90" cy="90" r="64" fill="none" stroke="${a.color}" stroke-width="20" stroke-dasharray="${len} ${402.124-len}" stroke-dashoffset="${-old}" transform="rotate(-90 90 90)"/>`}).join('')}<text x="90" y="85" text-anchor="middle" font-size="24" font-weight="600" fill="#18263c">${fmt(v.cost/10000,0)}</text><text x="90" y="108" text-anchor="middle" font-size="12" fill="#66758a">万元 · 研发成本</text></svg><div class="donut-legend">${rows.map(a=>`<div><i style="background:${a.color}"></i><span>${a.name}</span><strong>${money(a.val)}<small>万</small></strong><em>${fmt(a.val/v.cost*100,1)}%</em></div>`).join('')}</div></div>`;}
function costPage(c,r){const v=r.resource,k=DEMO.common;return `<div class="subsection-intro"><span class="icon-tile">${icon('wallet')}</span><div><h2>研发成本与资源效率 <strong>${fmt(v.score,2)} / 20</strong></h2><p>规则负责人：HR + 资源办 · 预算约束8分 + 增量ROI12分</p></div></div>`+
`<div class="cost-kpis"><section><span>${icon('wallet')}本期研发投入</span><strong>${money(v.cost)}<small> 万元</small></strong><p>预算120万 · 执行率 ${fmt(v.cost/k.budget*100,1)}%</p></section><section><span>${icon('target')}任务能力增益</span><strong>+${v.delta}<small> 个百分点</small></strong><p>${k.base}% → ${c.performance}% · 目标增益20个百分点</p></section><section><span>${icon('chart')}增量能力 ROI</span><strong>${fmt(v.roi,1)}</strong><p>百分点/亿元 · 目标 ${fmt(v.targetRoi,1)}</p></section></div>`+
sectionHead('01','投入：钱花在哪里','两例按相同算法研发边界比较，费用含API。')+
`<section class="panel"><div class="grid two"><div>${donutCost(c,v)}</div><div class="cost-inputs"><div>${icon('cpu')}<span>研发算力</span><strong>${fmt(c.hours,0)} 卡时 × 25.2元</strong></div><div>${icon('people')}<span>正式员工</span><strong>${c.formal} 人月 × 5万元</strong></div><div>${icon('people')}<span>实习生</span><strong>${c.intern} 人月 × 1万元</strong></div><div>${icon('file')}<span>研发API</span><strong>${money(c.api)} 万元</strong></div><div class="caption">正式员工5万元/人月为当前单价；加权人月 ${fmt(v.weightedMonths,1)} 仅供成本折算。</div></div></div><div class="scope-strip">核算边界：不含部署运营、实验耗材与设备，不是全项目财务收益率。</div></section>`+
sectionHead('02','计分：投入产出如何影响总分','两项同时受目标达成系数 q 约束，低成本不能抵消未完成目标。')+
`<div class="q-strip"><span class="icon-tile">${icon('target')}</span><div><h3>目标增益达成 ${fmt(v.delta/20*100,0)}%，计分系数 q = ${fmt(v.q,2)}</h3><p>q = min(1, ${v.delta} ÷ 20)，资源分最高为20q = ${fmt(20*v.q,1)}分。</p></div></div><div class="grid two"><section class="panel"><div class="panel-head"><h3>预算约束</h3><strong class="section-score">${fmt(v.budgetScore,2)}<small> / 8</small></strong></div>${progress(v.budgetScore,8,'green')}<p class="score-reason">${v.budgetScore===8?'预算内完成目标，本项不扣分。':`扣 ${fmt(8-v.budgetScore,3)} 分：增益未达目标，且成本超预算。`}</p><details><summary>展开代入公式</summary><div class="detail-body"><div class="rule-formula">8 × q × min(1, 预算/成本)<br>= 8 × ${fmt(v.q,2)} × ${fmt(Math.min(1,k.budget/v.cost),2)}<br>= ${fmt(v.budgetScore,3)}</div></div></details></section><section class="panel"><div class="panel-head"><h3>增量 ROI</h3><strong class="section-score">${fmt(v.roiScore,2)}<small> / 12</small></strong></div>${progress(v.roiScore,12,'green')}<p class="score-reason">${v.roiScore===12?'任务达成且单位资源产出达到目标，本项不扣分。':`扣 ${fmt(12-v.roiScore,3)} 分：q为${fmt(v.q,2)}，ROI为目标的${fmt(v.roi/v.targetRoi*100,0)}%。`}</p><details><summary>展开代入公式</summary><div class="detail-body"><div class="rule-formula">12 × q × min(1, 实际ROI/目标ROI)<br>= 12 × ${fmt(v.q,2)} × ${fmt(Math.min(1,v.roi/v.targetRoi),2)}<br>= ${fmt(v.roiScore,3)}</div><p>实际ROI = ${v.delta} ÷ ${v.cost/1e8} = ${fmt(v.roi,2)} 百分点/亿元。</p></div></details></section></div>`+
`<div class="contribution-strip"><span>计入综合评价</span><strong>${fmt(v.budgetScore,3)} + ${fmt(v.roiScore,3)} = ${fmt(v.score,3)} 分</strong><span>与科学价值 ${r.science} 分合计 <b>${fmt(r.total,3)}</b>，显示 ${fmt(r.total)} 分。</span></div>`+resourceReference();}
function scienceRubric(){return DEMO.science.map(d=>`<details><summary>${d.name} · 20分</summary><div class="detail-body"><table><thead><tr><th>档位</th><th>必要条件</th></tr></thead><tbody>${d.levels.map((l,i)=>`<tr><td class="numeric">${i}档 / ${i*5}分</td><td>${l}</td></tr>`).join('')}</tbody></table></div></details>`).join('');}
function resourceRules(){return `<div class="rule-formula">C = H × 25.2 + F × 50,000 + I × 10,000 + API（元）<br>Δ = max(0, 实际成功率 − 基线)，Δt = 目标 − 基线<br>q = min(1, Δ / Δt)<br>ROI = Δ / (C / 100,000,000)<br>目标ROI = Δt / (预算 / 100,000,000)<br>预算约束分 = 8 × q × min(1, 预算 / C)<br>ROI分 = 12 × q × min(1, ROI / 目标ROI)</div><p class="caption">H为卡时，F/I为正式/实习人月；成功率按60、80等百分数数值计算，增益单位为百分点。ROI分子不使用科学分或总分，避免循环计分。两部分重复体现增益为有意的目标达成约束，强度待校准。</p>`;}
function rulesContent(){return sectionHead('01','评价结构与职责','两层解耦；任务完成不直接代表已形成标志性成果。')+
`<div class="rule-map"><article><span class="icon-tile">${icon('target')}</span><div><h2>一级任务考核</h2><p>科管 + 评测中心</p><strong>是否兑现930承诺</strong><p>完成度100分 + 优良中差条件分档</p></div></article><article><span class="icon-tile">${icon('award')}</span><div><h2>标志性成果评价</h2><p>总师 / HR / 资源办</p><strong>科学价值80分 + 资源效率20分</strong><p>科学认定和资源决策保留人工复核</p></div></article></div>`+
sectionHead('02','评分规则','当前权重与档位为当前方案，待共识案例校准。')+
`<details class="rule-fold"><summary>${icon('target')}一级任务：计算与验收门槛（评测中心）<span class="fold-tag">100分诊断</span></summary><div class="detail-body"><div class="weight-strip">${DEMO.tasks.map(t=>`<div style="flex:${t.max}"><strong>${t.max}分</strong><span>${t.name}</span></div>`).join('')}</div><p>评测中心的四任务权重25/25/30/20，拆为12项；其他中心权重见各自任务详情。数据任务包括评测集、平台、数据规模与分类分级，当前提高对应权重，正式需校准。</p><div class="rule-formula">数量项 = 权重 × min(实际验收数/目标数, 1)<br>条件项 = 通过计满分，确认未通过计0分<br>证据不完整 → 待核验，不定档<br>基本目标有确定缺口 → 差<br>全部达到基本条件 → 中<br>达到良好 / 优秀锚点且经确认 → 良 / 优</div><p>缺证据不记作0分，不对已知项重新归一化。区间为已核定分～已核定分+未知项满分。当前情景若缺少15分体系材料，则诊断区间78.7–93.7分；因材料缺失，最终等级待核验；已知缺口继续列示。完成度不按90/80/60直接换档。</p></div></details>
<details class="rule-fold"><summary>${icon('flask')}高峰案例：科学价值rubric与证据门槛<span class="fold-tag">80分</span></summary><div class="detail-body">${scienceRubric()}<p>benchmark改善不能替代科学新认识；材料实验类仅计算预测时实证维最高1档；缺少独立验证时复现维不能给3–4档。0档须基于已核查的提交包，材料未到应待核验。</p></div></details>

<details class="rule-fold"><summary>${icon('shield')}催化材料案例：综合评级与复核<span class="fold-tag">待确认</span></summary><div class="detail-body"><table><thead><tr><th>等级</th><th>评价条件</th></tr></thead><tbody><tr><td>优</td><td>总分≥85、科学≥60、四个科学维度均≥3档且任务能力达标。</td></tr><tr><td>差</td><td>总分＜60；针对当前提交材料，补证后可复评。</td></tr><tr><td>待复核</td><td>其余完整计分结果。数据缺失时另标待核验。</td></tr></tbody></table><p>任何得分都不自动认定科学突破。正式规则需先对齐总师认可的金标准与共识案例，再灰度运行。</p></div></details>`;}

function renderLegacy(){

  const nav=parts[0]==='featured'?'featured':'overview';
  document.querySelectorAll('[data-nav]').forEach(a=>{const active=a.dataset.nav===nav;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const center=parts[0]==='center'?getCenter(parts[1]):null;
  $('#breadcrumb').textContent=center?center.name:nav==='featured'?'关键案例 · 建设方案':'中心评价总览';
  const route=parts[0];
  $('#main').innerHTML=presentationHtml(route==='overview'?leaderOverview():route==='center'?(parts[1]==='evaluation'&&parts[2]==='planning'?planningPage():centerPage(parts[1],parts[2])):route==='task'?taskPage(parts[1]):route==='outcome'?centerOutcomePage(parts[1]):route==='case'?casePage(parts[1],parts[2]):route==='tasks'?centersPage('tasks'):route==='outcomes'?centersPage('outcomes'):['comparison','outcome-report'].includes(route)?outcomes():route==='task-report'?dashboard():route==='featured'?featuredPage():route==='rules'?rulesPage():leaderOverview());
  window.scrollTo(0,0);
}

function csvParse(text){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++;}else quote=!quote;}else if(c===','&&!quote){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell='';}else cell+=c;}if(quote)throw Error('CSV引号未闭合。');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows;}
function csvWrite(rows){return '\ufeff'+rows.map(row=>row.map(v=>{let s=String(v??'');if(/^[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}).join(',')).join('\r\n');}
function xmlDoc(text){const d=new DOMParser().parseFromString(text.replace(/^\uFEFF/, '').trimStart(),'application/xml');if(d.getElementsByTagName('parsererror').length)throw Error('文件中的XML格式无效。');return d;}
const xmlNodes=(root,name)=>Array.from(root.getElementsByTagNameNS('*',name));
async function safeZip(file){if(file.size>15*1024*1024)throw Error('单文件上限15MB，请拆分材料。');const zip=await JSZip.loadAsync(file);if(Object.keys(zip.files).length>2500)throw Error('文件条目过多，请拆分。');return zip;}
async function zipText(zip,name){const f=zip.file(name);if(!f)return '';const text=await f.async('string');if(text.length>6000000)throw Error('解压后的文本过大，请拆分。');return text;}
async function readXlsx(file){const zip=await safeZip(file),shared=xmlDoc(await zipText(zip,'xl/sharedStrings.xml')||'<sst/>');const strings=xmlNodes(shared,'si').map(si=>xmlNodes(si,'t').map(t=>t.textContent).join(''));const wb=xmlDoc(await zipText(zip,'xl/workbook.xml')),rels=xmlDoc(await zipText(zip,'xl/_rels/workbook.xml.rels'));const paths={};for(const r of xmlNodes(rels,'Relationship'))paths[r.getAttribute('Id')]=r.getAttribute('Target');const out=[];for(const sh of xmlNodes(wb,'sheet')){const target=paths[sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')];if(!target)continue;const path=target.startsWith('/')?target.slice(1):'xl/'+target.replace(/^\.\//,'');const doc=xmlDoc(await zipText(zip,path)),rows=[];for(const rr of xmlNodes(doc,'row')){const row=[];for(const cell of xmlNodes(rr,'c')){const ref=cell.getAttribute('r')||'A1',letters=ref.match(/^[A-Z]+/)[0];let col=0;for(const letter of letters)col=col*26+letter.charCodeAt(0)-64;const type=cell.getAttribute('t'),v=xmlNodes(cell,'v')[0]?.textContent||'';row[col-1]=type==='s'?(strings[Number(v)]||''):type==='inlineStr'?xmlNodes(cell,'t').map(x=>x.textContent).join(''):v;}rows.push(row);}out.push({name:sh.getAttribute('name'),rows});}return out;}
function tableRecords(rows,fields){const clean=x=>String(x??'').replace(/^\ufeff/,'').replace(/\*/g,'').trim();const idx=rows.findIndex(row=>row.some(x=>clean(x)===fields[0][1]));if(idx<0)return null;const header=rows[idx].map(clean),missing=fields.filter(f=>!header.includes(f[1])).map(f=>f[1]);if(missing.length)throw Error('缺少列：'+missing.join('、'));return rows.slice(idx+1).filter(row=>row.some(x=>present(x))).map(row=>Object.fromEntries(fields.map(([key,label])=>[key,String(row[header.indexOf(label)]??'').slice(0,20000)])));}
async function parseRuleImport(file,p,role){if(file.size>15*1024*1024)throw Error('单文件上限15MB。');const ext=file.name.split('.').pop().toLowerCase();let sheets;if(ext==='xlsx')sheets=await readXlsx(file);else if(ext==='csv')sheets=[{name:'当前责任方',rows:csvParse(await file.text())}];else if(ext==='json'){const x=JSON.parse(await file.text());if(!Array.isArray(x.rules)||!x.rules.length||x.rules.length>200||x.rules.some(r=>!r||typeof r!=='object'))throw Error('规则JSON需包含1至200条有效规则。');return [{role,rules:x.rules.map(r=>{const b=blankRule(p,role);for(const[k]of RULE_FIELDS)b[k]=String(r[k]??'').slice(0,20000);b.source='导入：'+file.name;return b;})}];}else throw Error('规则表支持.xlsx、.csv或规则.json。');const names={'中心任务规则':'center','总师科学规则':'chief','HR人力规则':'hr','资源办成本规则':'resource'};const batches=[];for(const sheet of sheets){if(sheet.name==='人力投入表'){const rows=tableRecords(sheet.rows,HR_FIELDS);if(rows)batches.push({costType:'hr',rows:rows.filter(r=>present(r.category)||present(r.months))});continue;}if(sheet.name==='资源投入表'){const rows=tableRecords(sheet.rows,RES_FIELDS);if(rows)batches.push({costType:'resources',rows:rows.filter(r=>present(r.category)||present(r.quantity))});continue;}const rr=tableRecords(sheet.rows,RULE_FIELDS);if(!rr)continue;const owner=names[sheet.name]||role;const rules=rr.filter(r=>present(r.indicator)||present(r.definition)||present(r.dimension)||present(r.rid)).map(r=>({...blankRule(p,owner),...r,_id:uid('rule'),source:'导入：'+file.name,status:'草稿',confirmedAt:''}));if(rules.length)batches.push({role:owner,rules});}if(!batches.some(b=>(b.rules||b.rows).length))throw Error('未发现已填写内容；空模板和仅责任方标签不会作为规则导入。');return batches;}
async function materialText(file){const ext=file.name.split('.').pop().toLowerCase();if(file.size>15*1024*1024)throw Error('单文件上限15MB。');if(['txt','md','csv','json'].includes(ext)){const s=await file.text();return{text:s.slice(0,200000),status:s.length>200000?'已提取文本（仅保留前20万字）':'已提取文本'};}if(['pptx','docx'].includes(ext)){const zip=await safeZip(file);const paths=Object.keys(zip.files).filter(n=>ext==='pptx'?/^ppt\/slides\/slide\d+\.xml$/.test(n):n==='word/document.xml').sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));let text='';for(const path of paths){const doc=xmlDoc(await zipText(zip,path));text+='\n['+(ext==='pptx'?'幻灯片'+path.match(/slide(\d+)/)[1]:'文档正文')+']\n'+xmlNodes(doc,'p').map(par=>xmlNodes(par,'t').map(t=>t.textContent).join('')).filter(Boolean).join('\n');}return {text:text.slice(0,200000),status:text.length>200000?'已提取文字（截断）':'已提取正文文字；图片未解析'};}return {text:'',status:'已登记附件；需补充正文或接入正式Agent解析'};}



function reportBreakdown(p,r){const groups={};for(const row of r.rows){if(!groups[row.dimension])groups[row.dimension]={name:row.dimension,max:0,score:0,pending:0};const g=groups[row.dimension];g.max+=row.max;if(row.score===null)g.pending++;else g.score+=row.score;}const cost=costTotals(r.snapshot);return `<div class="grid two section"><section class="panel"><div class="visual-title">${icon('chart')}<h3>各部分得分</h3></div>${Object.values(groups).filter(g=>g.max>0).map(g=>`<div class="science-mini"><span>${esc(g.name)}</span>${progress(g.score,g.max,'blue')}<strong>${fmt(g.score)}<small> / ${fmt(g.max,0)}</small></strong></div>${g.pending?`<p class="caption">${esc(g.name)}有${g.pending}项待核验，横条仅显示已计算分值。</p>`:''}`).join('')}</section><section class="panel"><div class="visual-title">${icon(p.kind==='outcomes'?'wallet':'shield')}<h3>${p.kind==='outcomes'?'投入口径与核算':'任务验收说明'}</h3></div>${p.kind==='outcomes'?`<p>已录入且可计算投入 <strong>${money(cost.known)}万元</strong>；${cost.unknown?cost.unknown+'行金额待补全。':cost.lines.length?'账目与凭证待责任方复核。':'尚未填写投入，不能视为零成本。'}</p><p class="caption">${esc(r.snapshot.boundary||'成本归集边界待填写')}</p><p>人力、算力与API按填报的数量、单价及分摊计算。评分使用本次冻结规则，细则可在下方展开。</p>`:'<p>完成程度得分与验收状态分别展示。四档按条件锚点评价：基本目标未完成为差，达到基本目标为中，良与优须记录更高档条件及责任确认；缺证据保持待核验。</p><p class="caption">实际绩效结论由科管及责任中心复核，分项证据和版本可在下方查看。</p>'}</section></div>`;}

function ruleEditor(p,role,r){const errors=ruleErrors(r);function rf(k,label,placeholder=''){return field(label||RULE_FIELDS.find(x=>x[0]===k)[1],`rule.${role}.${r._id}.${k}`,r[k],placeholder);}function ra(k,label,placeholder=''){return area(label||RULE_FIELDS.find(x=>x[0]===k)[1],`rule.${role}.${r._id}.${k}`,r[k],placeholder,2);}return `<div class="rule-editor" id="rule-editor"><div class="panel-head"><h3>编辑指标 · ${esc(r.indicator||'新指标')}</h3>${badge(r.status,r.status==='已确认'?'green':'amber')}</div><div class="form-section-title">指标与适用范围</div><div class="form-grid three">${rf('rid','规则ID *','可填写本部门规则编号')}${rf('scope','评价类型 *','中心任务 / 标志性成果')}${rf('applies','适用中心或成果 *','填写明确的适用范围')}${rf('dimension','一级维度 *','由责任部门设计')}${rf('indicator','指标名称 *','填写可评价的指标')}${rf('version','规则版本 *','如v1.0')}${ra('definition','指标定义 *','说明测量或评价的对象、边界与单位。')}</div><div class="form-section-title">目标、权重与评分</div><div class="form-grid three">${rf('target','目标或基准 *','按业务规则填写')}${rf('unit','单位','个 / 条 / 分 / 元等')}${rf('max','满分 *','该指标的分值上限')}
<label class="wf-field"><span>计分方式 *</span><select data-bind="rule.${role}.${r._id}.method"><option value="">请选择</option>${METHODS.map(m=>`<option ${r.method===m?'selected':''}>${m}</option>`).join('')}</select></label>${rf('gate','达标门槛 *','由责任方填写')}${rf('deduction','扣分条件 *','由责任方填写')}${ra('criteria','分档或计算细则 *','给出可判断的档位条件或公式；公式仅存为文本，不作为代码执行。')}</div><div class="form-section-title">证据与确认</div><div class="form-grid">${ra('evidence','必需证据 *','说明需要什么材料、时间范围及可定位方式。')}${ra('acceptance','验收方式 *','如何验证目标、事实与证据是否满足条件。')}${rf('missing','缺证据处理 *','如：待核验，不以零分替代')}${rf('owner','责任方 *',ROLE_META[role].name)}${rf('confirmer','责任确认人 *','实际确认人填写；本地记录不校验身份')}${rf('notes','备注','可选')}</div><div class="rule-validation">${errors.length?`待补充 ${errors.length} 项：${esc(errors.join('；'))}`:'字段完整，可以记录责任方的本地确认。'}</div><div class="btn-row">${actionButton('save','保存草稿')}${actionButton('confirm-rule','记录本地确认','primary',`data-role="${role}" data-id="${r._id}"`)}${actionButton('close-editor','收起编辑')}</div><p class="caption">比例达成固定按满分×min(实际/目标,1)计分；是否达成固定按通过/未通过计满分或0分。其他公式请选择人工评议，离线保持待核验。此处只记录填写者声明，不代表经过真实账号审批。确认后修改规则会退回草稿，并使既有报告失效。</p></div>`;}

function rulesStep(p){const all=rulesOf(p),issues=blockingIssues(p);return `<div class="responsibility-flow"><div>${icon('file')}<strong>输入材料</strong><span>科管 / HR / 资源办</span></div><div>${icon('chart')}<strong>建议规则</strong><span>Agent建议，非自动生效</span></div><div>${icon('shield')}<strong>业务方确认</strong><span>总师 / 科管 / HR / 资源办</span></div></div><section class="panel"><div class="panel-head"><div><h2>规则形成与确认</h2><p class="subtext">中台负责结构化建议与执行；权重及科学、成本口径由责任方决定。</p></div><div class="btn-row">${actionButton('propose','生成建议草稿')}${p.demoKey?actionButton('confirm-demo','确认预设规则','primary'):''}</div></div><p class="caption">从材料中提取候选目标并创建待补全表格，权重、分档和证据要求由责任方补充。</p>${roleCards(p)}</section>`+
sectionHead('01','当前规则清单','满分合计 '+fmt(all.reduce((s,r)=>s+(numeric(r.max)||0),0),1)+' 分；最终标准化至100分，不固定各维度占比。')+
`<section class="panel">${all.length?`<div class="table-wrap"><table><thead><tr><th>责任方 / 指标</th><th>目标与方法</th><th>满分</th><th>规则来源</th><th>状态</th><th>编辑</th></tr></thead><tbody>${all.map(r=>`<tr><td><strong>${esc(r.indicator||'未命名')}</strong><div class="subtext">${ROLE_META[r._role].name} · ${esc(r.dimension)}</div></td><td>${esc(r.target||'目标待填')}<div class="subtext">${esc(r.method||'方法待填')}</div></td><td>${esc(r.max||'待填')}</td><td>${esc(r.source)}</td><td>${badge(r.status,r.status==='已确认'?'green':'amber')}<div class="subtext">${esc(r.confirmer||'确认人待填')}</div></td><td>${actionButton('goto-edit','填写 / 编辑','small',`data-role="${r._role}" data-id="${r._id}"`)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty-state"><h3>尚无规则</h3><p>请由责任方填报，或生成建议草稿后补全并确认。</p></div>'}</section>`+
taskRatingFields(p)+sectionHead('02','实际结果与证据定位','录入事实与自述，执行后仍需核验材料真实性。')+

}

function navigate(hash){const href=routeHref(hash);if(location.hash===href)render();else location.hash=href;}
function updateDraftHints(p,keys){const mode=document.querySelector('.wf-package>.btn-row>.pill');if(mode){mode.textContent=p.demoKey?'预设方案':'本机填报草稿';mode.className='pill '+(p.demoKey?'amber':'blue');}if(keys[0]==='rule'){const pill=document.querySelector('.rule-editor>.panel-head>.pill');if(pill){pill.textContent='草稿';pill.className='pill amber';}const edit=document.querySelector('.rule-intake-table [data-id="'+keys[2]+'"]');const status=edit?.closest('tr')?.querySelector('.pill');if(status){status.textContent='草稿';status.className='pill amber';}}}
function onFieldInput(el){const bind=el.dataset.bind;if(!bind)return;const p=project(),keys=bind.split('.'),value=el.value;let previous,keepDemo=false;
  if(keys[0]==='project'){previous=p[keys[1]];p[keys[1]]=value;if(keys[1]==='reviewNotes'){persist();return;}}
  else if(keys[0]==='role'){previous=p.roles[keys[1]].note;p.roles[keys[1]].note=value;}
  else if(keys[0]==='rule'){const r=p.roles[keys[1]].rules.find(r=>r._id===keys[2]);if(!r)return;previous=r[keys[3]];r[keys[3]]=value;r.status='草稿';r.confirmedAt='';keepDemo=keys[3]==='confirmer';}
  else if(keys[0]==='cost'){const row=p[keys[1]][Number(keys[2])];if(!row)return;previous=row[keys[3]];row[keys[3]]=value;}
  else if(keys[0]==='fact'){const f=p.facts[keys[1]]||(p.facts[keys[1]]={});previous=f[keys[2]];f[keys[2]]=value;}else return;
  if(previous!==value){touch(p,'更新填报：'+bind,keepDemo);updateDraftHints(p,keys);const box=document.querySelector('.rule-validation');if(box&&keys[0]==='rule'){const r=p.roles[keys[1]].rules.find(r=>r._id===keys[2]),errors=ruleErrors(r);box.textContent=errors.length?'待补充 '+errors.length+' 项：'+errors.join('；'):'字段完整，可以记录责任方的本地确认。';}const tally=document.querySelector('.cost-tally');if(tally&&keys[0]==='cost'){const t=costTotals(p);tally.textContent='全部已填投入的可计算金额：'+money(t.known)+'万元；'+(t.unknown?t.unknown+'行参数待补全，非完整总成本。':'录入金额已重算，凭证待业务方复核。');}const note=document.querySelector('.wf-notice');if(note)note.textContent=storageOK?'修改已保存在本机；规则或输入变更后需重新执行。':'本机保存失败，请导出填报包。';}
}
function proposeRules(p){if(p.demoKey&&rulesOf(p).length){showNotice('预设方案已包含建议规则，请查看各项权重、条件与证据后确认。');return;}const material=Object.values(p.roles).flatMap(x=>x.materials).filter(m=>m.text);const source=p.description.trim()?p.description:material.map(m=>m.text).join('\n');if(!source.trim())throw Error('请先输入作战图 / 成果正文，或上传可提取文字的材料。');let lines=source.split(/[\n。；]/).map(s=>s.trim()).filter(s=>s.length>4&&(/\d|目标|完成|达到|建设|验证|交付|突破/.test(s)));if(!lines.length)lines=[source.slice(0,180)];lines=[...new Set(lines)].slice(0,8);let added=0;const role=p.kind==='tasks'?'center':'chief';for(const [i,line]of lines.entries()){if(p.roles[role].rules.some(r=>r.definition===line))continue;const r=blankRule(p,role);Object.assign(r,{rid:'SUG-'+(i+1),applies:p.center+(p.title?' / '+p.title:''),indicator:line.slice(0,36),definition:line,source:'文本候选提取（本地计算）',status:'待补全',notes:'候选文本来自：'+(p.description.trim()?'填报正文 / 摘要':material.map(m=>m.name).join('；'))+'。请核对评价周期；不自动认定数字为目标，不自动分配权重。'});p.roles[role].rules.push(r);added++;}touch(p,'生成 '+added+' 条文本候选规则');showNotice('已新增 '+added+' 条建议草稿。目标、满分、分档、证据要求及确认人需业务方填写；其他责任方请在各自入口补充。');}
async function executeEvaluation(p){const issues=blockingIssues(p);if(issues.length)throw Error('尚不能执行：'+issues.slice(0,3).join('；'));if(EXECUTION)return;const snapshot=clone(p);EXECUTION={projectId:p.id,stage:0};render(false);try{for(let i=1;i<4;i++){await new Promise(resolve=>setTimeout(resolve,420));EXECUTION.stage=i;render(false);}p.report=evaluateProject(snapshot);p.audit.unshift({at:new Date().toISOString(),action:'完成本地计算评测，绑定输入版本 r'+snapshot.revision});persist();WF_NOTICE=p.revision===snapshot.revision?'评测已完成。请展开各指标查看计算、原因和证据定位。':'执行期间输入已变化；生成报告对应旧输入，请重新评测。';}finally{EXECUTION=null;render(false);}}
async function handleAction(el){const action=el.dataset.action,p=project(),role=el.dataset.role||STORE.role,r=p.roles[role]?.rules.find(x=>x._id===el.dataset.id);WF_NOTICE='';
  switch(action){
    case 'new-project':addProject(newProject(p.kind));navigate(p.kind+'/input');break;
    case 'demo-task':case 'demo-good':case 'demo-poor':{const kind=action==='demo-task'?'tasks':'outcomes',key=action.replace('demo-','');addProject(makeDemo(kind,key));WF_NOTICE='已新建评价，原草稿保留。评分规则尚待确认。';navigate(kind+'/input');break;}
    case 'save':persist();showNotice(storageOK?'草稿已保存在此浏览器。跨电脑使用请导出填报包。':'本机存储不可用，请导出填报包。');break;
    case 'export-project':jsonDownload((p.title||'未命名评价')+'-填报包.json',{schema:3,exportedAt:new Date().toISOString(),...p,report:null});showNotice('填报包已导出，包含文本、规则与投入明细；不包含原始附件二进制。重新导入后需再次确认规则。');break;
    case 'kind-tasks':case 'kind-outcomes':STORE.kind=action==='kind-tasks'?'tasks':'outcomes';WF_EDIT=null;IMPORT_PREVIEW=null;persist();if(routePart()[0]==='intake')navigate('intake/'+STORE.role+'/'+STORE.kind);else render(false);break;
    case 'download-xlsx':{const binary=atob(TEMPLATE_XLSX_BASE64),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));downloadFile('evaluation-template.xlsx',new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));showNotice('Excel模板已下载。请由各责任方填报对应工作表，再导入预览。');break;}
    case 'download-csv':downloadFile(ROLE_META[role].name+'-规则模板.csv',csvWrite([RULE_FIELDS.map(f=>f[1]),RULE_FIELDS.map(([k])=>k==='owner'?ROLE_META[role].name:'')]),'text/csv;charset=utf-8');break;
    case 'export-rules':jsonDownload(ROLE_META[role].name+'-规则.json',{schema:3,rules:p.roles[role].rules});break;
    case 'add-rule':{const row=blankRule(p,role);p.roles[role].rules.push(row);WF_EDIT=row._id;touch(p,'新增'+ROLE_META[role].name+'规则');render(false);document.getElementById('rule-editor')?.scrollIntoView({block:'start',behavior:'smooth'});break;}
    case 'edit-rule':WF_EDIT=el.dataset.id;render(false);document.getElementById('rule-editor')?.scrollIntoView({block:'start',behavior:'smooth'});break;
    case 'goto-edit':WF_EDIT=el.dataset.id;STORE.role=role;navigate('intake/'+role);break;
    case 'close-editor':WF_EDIT=null;render(false);break;
    case 'remove-rule':p.roles[role].rules=p.roles[role].rules.filter(x=>x._id!==el.dataset.id);delete p.facts[el.dataset.id];touch(p,'移除一条规则');render(false);break;
    case 'confirm-rule':{if(!r)return;const errors=ruleErrors(r);if(errors.length)throw Error('规则尚不能确认：'+errors.join('；'));r.status='已确认';r.confirmedAt=new Date().toISOString();touch(p,ROLE_META[role].name+'规则本地确认：'+r.indicator,true);showNotice('已记录本地确认。离线版不验证填写者身份，正式审批需接入账号与权限。');break;}
    case 'confirm-demo':if(!p.demoKey)throw Error('只有未修改的内置预设方案支持批量确认。');for(const data of Object.values(p.roles))for(const rule of data.rules){rule.confirmer='预设规则确认';rule.status='已确认';rule.confirmedAt=new Date().toISOString();}touch(p,'预设规则批量确认（责任方）',true);showNotice('预设规则已确认，可以执行。此按钮仅用于内置预设方案，不是正式审批。');break;
    case 'apply-import':{if(!IMPORT_PREVIEW||IMPORT_PREVIEW.projectId!==p.id)throw Error('评价对象已变化，请重新导入预览。');for(const b of IMPORT_PREVIEW.batches){if(b.costType)p[b.costType].push(...b.rows);else p.roles[b.role].rules.push(...b.rules);}touch(p,'导入规则与投入：'+IMPORT_PREVIEW.name);IMPORT_PREVIEW=null;showNotice('已追加导入，请按责任方核对字段并确认规则。');break;}
    case 'cancel-import':IMPORT_PREVIEW=null;render(false);break;
    case 'add-cost':{const type=el.dataset.cost,fields=type==='hr'?HR_FIELDS:RES_FIELDS;p[type].push(Object.fromEntries(fields.map(([k])=>[k,''])));touch(p,'新增投入明细');render(false);break;}
    case 'remove-cost':p[el.dataset.cost].splice(Number(el.dataset.index),1);touch(p,'移除投入明细');render(false);break;
    case 'export-cost':{const type=el.dataset.cost,fields=type==='hr'?HR_FIELDS:RES_FIELDS;downloadFile((type==='hr'?'人力':'资源')+'投入.csv',csvWrite([fields.map(f=>f[1]),...p[type].map(row=>fields.map(([k])=>row[k]))]),'text/csv;charset=utf-8');break;}
    case 'remove-material':p.roles[role].materials=p.roles[role].materials.filter(m=>m.id!==el.dataset.id);touch(p,'移除材料登记');render(false);break;
    case 'propose':proposeRules(p);break;
    case 'execute':await executeEvaluation(p);break;
    case 'export-report':if(p.report)jsonDownload((p.title||'评价')+'-报告.json',{...p.report,currentRevision:p.revision,stale:p.report.revision!==p.revision,reviewNotes:p.reviewNotes,disclaimer:'本地计算结果，非正式绩效认定；本地确认不验证身份。'});break;
    case 'export-report-csv':if(p.report)downloadFile((p.title||'评价')+'-得分.csv',csvWrite([['报告状态','责任方','维度','指标','得分','满分','事实','规则','计算','得分原因','证据','定位','规则版本'],...p.report.rows.map(r=>[p.report.revision!==p.revision?'旧版本报告':'本地计算',ROLE_META[r.role].name,r.dimension,r.name,r.score===null?'待核验':r.score,r.max,r.fact,r.rule.criteria,r.calc,r.reason,r.evidence,r.location,r.rule.version])]),'text/csv;charset=utf-8');break;
  }
}
async function handleUpload(input){const p=project(),role=STORE.role,files=Array.from(input.files||[]),type=input.dataset.upload;if(!files.length)return;WF_NOTICE='正在本机读取文件…';render(false);try{for(const file of files){if(file.size>15*1024*1024)throw Error('单文件上限15MB，请拆分。');if(type==='project-import'){const raw=JSON.parse(await file.text()),imported=sanitizeProject(raw);addProject(imported);WF_NOTICE='已导入填报包；规则需重新确认，旧报告与标识不会带入。';navigate(imported.kind+'/input');}
    else if(type==='rubric-import'){const batches=await parseRuleImport(file,p,role);if(project().id!==p.id)throw Error('读取期间评价对象发生变化，请重新导入。');IMPORT_PREVIEW={name:file.name,projectId:p.id,batches};WF_NOTICE='规则表已读取，请检查预览后追加。';}
    else if(type.startsWith('cost-')){const costType=type.slice(5),fields=costType==='hr'?HR_FIELDS:RES_FIELDS,rows=tableRecords(csvParse(await file.text()),fields);if(!rows)throw Error('未找到投入表头，请先导出本页CSV使用相同列名。');const valid=rows.filter(r=>present(r.category));if(!valid.length)throw Error('未发现已填写的投入行。');if(valid.length>200)throw Error('单次最多导入200行。');p[costType].push(...valid);touch(p,'导入投入明细：'+file.name);WF_NOTICE='已追加 '+valid.length+' 行投入，请核对数量、单价、分摊与凭证。';}
    else if(type.startsWith('material-')){const who=type.slice(9),content=await materialText(file);p.roles[who].materials.push({id:uid('material'),name:file.name,size:file.size,...content,source:'本机选择',at:new Date().toISOString()});touch(p,'读取材料：'+file.name);WF_NOTICE='材料已在本机登记。'+content.status+'；保存文字副本与文件信息，不保存原始附件。';}
  }}catch(e){WF_NOTICE='读取失败：'+e.message;}render(false);}
document.addEventListener('input',event=>{if(event.target.dataset.bind)onFieldInput(event.target);});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.upload){handleUpload(el);return;}if(el.dataset.action==='select-project'){STORE.active[STORE.kind]=el.value;WF_EDIT=null;IMPORT_PREVIEW=null;WF_NOTICE='';persist();render(false);}else if(el.tagName==='SELECT'&&el.dataset.bind)onFieldInput(el);});
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el||el.tagName==='SELECT'||el.disabled)return;event.preventDefault();handleAction(el).catch(e=>showNotice('操作未完成：'+e.message));});
window.addEventListener('hashchange',()=>{WF_NOTICE='';IMPORT_PREVIEW=null;render();});
render();


</script></body></html>
